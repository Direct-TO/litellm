general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Internal classifier; clients keep the single reference-generation entry point.
  # Select any configured chat model here; this is not hard-coded in the implementation.
  video_reference_intent:
    classifier_model: deepseek-chat
    models: [seedance-2-5]
    timeout: 20
  model_list_generation_only: true
  store_prompts_in_spend_logs: true
  # Opt-in: let CheckBatchCost track cost for unmanaged batches created with a raw
  # gs:// (Vertex) or s3:// (Bedrock) input_file_id. Requires a matching deployment
  # configured for the batched model. Defaults to false.
  # track_unmanaged_batch_cost: true

router_settings:
  routing_strategy: simple-shuffle
  enable_weighted_failover: true
  weighted_failover_policy:
    call_types:
      - aimage_generation
      - avideo_generation
    status_codes:
      - 403
      - 429
      - 503
    submission_outcomes:
      - rejected
    failure_scope: provider
    model_group_overrides:
      image-2.5-flare: &image_25_failover
        call_types: [aimage_generation]
        status_codes: [400, 401, 403, 404, 422, 429, 503]
        submission_outcomes: [rejected]
        failure_scope: deployment
      image-2.5-sunburst: *image_25_failover

sandbox_tools:
  - sandbox_tool_name: e2b_sandbox
    litellm_params:
      sandbox_provider: e2b
      api_key: os.environ/E2B_API_KEY

litellm_settings:
  drop_params: True
  telemetry: False
  code_interpreter_interception_params:
    enabled: true
    sandbox_tool_name: e2b_sandbox
  callbacks:
    - code_interpreter_interception
