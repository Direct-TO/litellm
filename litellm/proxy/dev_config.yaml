  # ---------- Media models ----------
  # Public model_name identifies the model. Provider names stay internal.
  # Same model_name may have multiple provider deployments for one public semantic model.
  # Router preflight keeps endpoint- and parameter-incompatible deployments out of each request.
  - model_name: image-2.5-flare
    litellm_params:
      model: toapis/gpt-image-2.5-flare
      api_key: os.environ/TOAPIS_API_KEY
      api_base: https://api.toapis.com/v1
      order: 1
      num_retries: 0
    model_info:
      mode: image_generation
      allowed_fails: 2
      cooldown_time: 60
      supported_endpoints:
        - /v1/images/generations
      allowed_fails_policy: &media_allowed_fails_policy
        AuthenticationErrorAllowedFails: 0
        TimeoutErrorAllowedFails: 2
        RateLimitErrorAllowedFails: 2
        InternalServerErrorAllowedFails: 2
        ServiceUnavailableErrorAllowedFails: 2
        BadGatewayErrorAllowedFails: 2
